<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1e1e1e">
    <link rel="manifest" href="manifest.json">
    <title>crush.wasm</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        width: 100%;
        height: 100%;
        background: #1e1e1e;
        overflow: hidden;
      }

      #terminal-container {
        width: 100%;
        height: 100%;
        /* xterm.js fills this element */
      }

      #loading {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1e1e1e;
        color: #ccc;
        font-family: monospace;
        font-size: 1rem;
        z-index: 10;
        transition: opacity 0.3s;
      }
      #loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>

    <!-- xterm.js from CDN -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.1.0-beta.274/css/xterm.css"
    />

    <script type="importmap">
    {
      "imports": {
        "comlink": "https://esm.sh/comlink@4.4.1",
        "@xterm/xterm": "https://esm.sh/@xterm/xterm@6.1.0-beta.285",
        "@xterm/addon-clipboard": "https://esm.sh/@xterm/addon-clipboard@0.3.0-beta.285",
        "@xterm/addon-fit": "https://esm.sh/@xterm/addon-fit@0.12.0-beta.285",
        "@xterm/addon-image": "https://esm.sh/@xterm/addon-image@0.10.0-beta.285",
        "@xterm/addon-webgl": "https://esm.sh/@xterm/addon-webgl@0.20.0-beta.284"
      }
    }
    </script>
  </head>
  <body>
    <div id="loading">Loading crush.wasm…</div>
    <div id="terminal-container"></div>

    <script type="module" src="main.js"></script>
  </body>
</html>
